services:
  kong:
    build:
      context: .
      dockerfile: Dockerfile
    image: kong-oidc-role:local
    container_name: kong-oidc-role
    ports:
      - "9180:8000" # proxy
      - "9181:8001" # admin
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_PLUGINS: bundled,oidc-role,acl
      # Demo-only value. Replace in real environments.
      KONG_X_SESSION_SECRET: "replace-with-long-random-secret"
      KONG_NGINX_LARGE_CLIENT_HEADER_BUFFERS: "4 16k"
      KONG_LOG_LEVEL: notice
    volumes:
      - ./config-example:/etc/kong:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
