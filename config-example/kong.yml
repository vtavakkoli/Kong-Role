_format_version: "3.0"
_comment: "DB-less example for oidc-role 2.0.0"

services:
  - name: lob1-service
    url: http://lob1:8080
    plugins:
      - name: oidc-role
        config:
          auth_mode: jwt
          discovery: https://idp.example.com/realms/example/.well-known/openid-configuration
          expected_issuer: https://idp.example.com/realms/example
          client_id: kong
          allowed_audiences: [kong]
          ssl_verify: true
          principal_claim: sub
          authorization_claims:
            - resource_access.kong.roles
            - realm_access.roles
            - groups
          expose_userinfo: false
          expose_id_token: false
          expose_access_token: false

routes:
  - name: lob1-route
    service: lob1-service
    paths: [/lob1]
    plugins:
      - name: acl
        config:
          allow: [lob1-user]
          always_use_authenticated_groups: true
          hide_groups_header: true
